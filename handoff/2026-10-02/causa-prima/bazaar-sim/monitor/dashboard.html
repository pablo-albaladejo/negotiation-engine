<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Bazaar Monitor Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e6e8eb;
    --muted: #8b93a1;
    --green: #3ecf6e;
    --red: #e5534b;
    --accent: #5aa7ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.4;
  }
  header.top {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
  }
  header.top h1 {
    margin: 0 0 10px 0;
    font-size: 18px;
  }
  .health-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .health-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--green); }
  .dot.bad { background: var(--red); }
  .dot.stale { background: #d9b53a; }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px;
  }
  section.block {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 20px;
  }
  section.block h2 {
    margin: 0 0 12px 0;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 13px;
  }
  th, td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th { color: var(--muted); font-weight: 600; }
  tr:hover td { background: var(--panel-2); }
  .kv {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px 16px;
  }
  .kv .row { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--border); padding: 4px 0; font-size: 13px; }
  .kv .row .k { color: var(--muted); }
  .muted { color: var(--muted); }
  .pill { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 600; }
  .pill.green { background: rgba(62,207,110,0.15); color: var(--green); }
  .pill.red { background: rgba(229,83,75,0.15); color: var(--red); }
  .pill.gray { background: rgba(139,147,161,0.15); color: var(--muted); }
  details { margin-top: 8px; }
  details > summary { cursor: pointer; color: var(--accent); font-size: 12px; }
  pre.raw {
    background: #0b0d11;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    overflow-x: auto;
    font-size: 12px;
    max-height: 400px;
  }
  .card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .card h3 { margin: 0 0 6px 0; font-size: 14px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .history-row { cursor: pointer; }
  .history-row td.status-green { color: var(--green); font-weight: 600; }
  .history-row td.status-red { color: var(--red); font-weight: 600; }
  .history-body { display: none; }
  .history-body.open { display: table-row; }
  .tag { font-size: 11px; background: var(--panel-2); border: 1px solid var(--border); padding: 1px 6px; border-radius: 4px; color: var(--muted); }
  .flex-between { display: flex; justify-content: space-between; align-items: baseline; }
  svg.spark { display: block; }
  .upcoming-list { font-size: 13px; }
  .upcoming-list .u-row { padding: 4px 0; border-bottom: 1px dashed var(--border); }
  .upcoming-list .u-at { color: var(--accent); font-weight: 600; margin-right: 6px; }
  .error-banner {
    background: rgba(229,83,75,0.12);
    border: 1px solid var(--red);
    color: var(--red);
    padding: 8px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .team-link { color: var(--accent); cursor: pointer; text-decoration: underline dotted; }
  .team-link:hover { color: #fff; }
  .team-panel-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 50;
  }
  .team-panel-backdrop.open { display: block; }
  .team-panel {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 520px;
    max-width: 95vw;
    overflow-y: auto;
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 16px 18px;
  }
  .team-panel h3 { margin: 0; font-size: 16px; }
</style>
</head>
<body>

<header class="top">
  <h1>Bazaar Hackathon API Monitor</h1>
  <div class="health-row" id="health-row"><span class="muted">Loading…</span></div>
</header>

<main>
  <div id="error-banner"></div>

  <section class="block" id="section-leaderboard">
    <h2>Leaderboard</h2>
    <div id="leaderboard-content" class="muted">Loading…</div>
  </section>

  <section class="block" id="section-clock">
    <h2>Clock</h2>
    <div id="clock-content" class="muted">Loading…</div>
  </section>

  <section class="block" id="section-schedule">
    <h2>Schedule</h2>
    <div id="schedule-content" class="muted">Loading…</div>
  </section>

  <section class="block" id="section-dealers">
    <h2>Dealers</h2>
    <div id="dealers-content" class="muted">Loading…</div>
  </section>

  <section class="block" id="section-levels">
    <h2>Levels</h2>
    <div id="levels-content" class="muted">Loading…</div>
  </section>

  <section class="block" id="section-rastro">
    <h2>El Rastro prices by rarity</h2>
    <div id="rastro-content" class="muted">Loading…</div>
  </section>

  <section class="block" id="section-patterns">
    <h2>Patterns</h2>
    <div class="flex-between" style="margin-bottom:10px;">
      <div class="sub">Momentum window:
        <select id="patterns-window">
          <option value="5">last 5m</option>
          <option value="10" selected>last 10m</option>
          <option value="all">all history</option>
        </select>
      </div>
    </div>
    <div id="patterns-content" class="muted">Loading…</div>
  </section>

  <section class="block" id="section-history">
    <h2>History / raw log</h2>
    <div id="history-content" class="muted">Loading…</div>
  </section>
</main>

<div class="team-panel-backdrop" id="team-panel-backdrop">
  <div class="team-panel" id="team-panel">
    <div id="team-panel-content"></div>
  </div>
</div>

<script>
const ENDPOINTS = ["clock", "leaderboard", "dealers", "schedule", "levels", "feed", "rastro_offers"];
const HISTORY_CAP = 50;
const REFRESH_MS = 5000;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function fmtAgo(ts) {
  if (!ts) return "never";
  const diffMs = Date.now() - new Date(ts).getTime();
  if (isNaN(diffMs)) return "unknown";
  const s = Math.floor(diffMs / 1000);
  if (s < 0) return "just now";
  if (s < 60) return s + "s ago";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m " + (s % 60) + "s ago";
  const h = Math.floor(m / 60);
  return h + "h " + (m % 60) + "m ago";
}

// Parse newline-delimited JSON, tolerating a trailing partial line.
function parseJsonl(text) {
  const lines = text.split("\n");
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    try {
      out.push(JSON.parse(line));
    } catch (e) {
      // Likely a partial last line being appended right now; skip it.
      if (i !== lines.length - 1) {
        console.warn("skipping malformed jsonl line", i, line.slice(0, 80));
      }
    }
  }
  return out;
}

function groupByEndpoint(entries) {
  const groups = {};
  for (const ep of ENDPOINTS) groups[ep] = [];
  for (const e of entries) {
    if (!groups[e.endpoint]) groups[e.endpoint] = [];
    groups[e.endpoint].push(e);
  }
  for (const ep of Object.keys(groups)) {
    groups[ep].sort((a, b) => new Date(a.ts) - new Date(b.ts));
  }
  return groups;
}

function renderHealth(groups) {
  const el = document.getElementById("health-row");
  el.innerHTML = "";
  for (const ep of ENDPOINTS) {
    const list = groups[ep] || [];
    const last = list[list.length - 1];
    const chip = document.createElement("div");
    chip.className = "health-chip";
    let dotClass = "bad";
    let label = "no data";
    if (last) {
      const ageS = (Date.now() - new Date(last.ts).getTime()) / 1000;
      const recentFailRun = list.slice(-5).every(e => e.status !== 200);
      if (last.status === 200 && ageS < 30) dotClass = "ok";
      else if (recentFailRun) dotClass = "bad";
      else if (ageS >= 30) dotClass = "stale";
      else dotClass = "ok";
      label = ep + ": " + fmtAgo(last.ts) + (last.status !== 200 ? " (HTTP " + last.status + ")" : "");
    } else {
      label = ep + ": no data yet";
    }
    chip.innerHTML = '<span class="dot ' + dotClass + '"></span><span>' + escapeHtml(label) + "</span>";
    el.appendChild(chip);
  }
}

function sparkline(values, w, h) {
  if (!values.length) return "";
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const stepX = values.length > 1 ? w / (values.length - 1) : 0;
  const points = values.map((v, i) => {
    const x = i * stepX;
    const y = h - ((v - min) / range) * h;
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
    '<polyline points="' + points + '" fill="none" stroke="#5aa7ff" stroke-width="1.5" /></svg>';
}

function renderLeaderboard(groups) {
  const el = document.getElementById("leaderboard-content");
  const list = groups.leaderboard || [];
  if (!list.length) { el.innerHTML = '<span class="muted">No snapshots yet.</span>'; return; }
  const latest = list[list.length - 1];
  if (latest.status !== 200 || !latest.body) {
    el.innerHTML = '<span class="pill red">last fetch failed (HTTP ' + latest.status + ')</span>';
    return;
  }
  const body = latest.body;
  const teams = (body.teams || []).slice().sort((a, b) => (a.rank ?? 0) - (b.rank ?? 0));

  // Build score history per team across recent snapshots (last 20).
  const recent = list.filter(e => e.status === 200 && e.body).slice(-20);
  const historyByTeam = {};
  for (const snap of recent) {
    for (const t of (snap.body.teams || [])) {
      if (!historyByTeam[t.team]) historyByTeam[t.team] = [];
      historyByTeam[t.team].push(t.score);
    }
  }

  let html = '<div class="sub">tick ' + body.tick + ' · t=' + body.t + 'h · round ' +
    (body.rounds && body.rounds[0] ? escapeHtml(body.rounds[0].name) : body.round) + '</div>';
  html += '<table><thead><tr><th>#</th><th>Team</th><th>Score</th><th>Trend</th><th>Lvl</th><th>Album</th><th>Deals</th><th>Luck</th><th>Rarest</th></tr></thead><tbody>';
  for (const t of teams) {
    const trend = sparkline(historyByTeam[t.team] || [t.score], 70, 20);
    html += '<tr>' +
      '<td>' + t.rank + '</td>' +
      '<td><span class="team-link" data-team="' + escapeHtml(t.team) + '">' + escapeHtml(t.name) + '</span></td>' +
      '<td>' + t.score.toFixed(2) + '</td>' +
      '<td>' + trend + '</td>' +
      '<td>' + t.level + '</td>' +
      '<td>' + t.album_filled + '/' + t.album_slots + '</td>' +
      '<td>' + t.deals + '</td>' +
      '<td>' + t.luck + '</td>' +
      '<td class="muted">' + (t.rarest ? escapeHtml(t.rarest.name) + ' (' + escapeHtml(t.rarest.rarity) + ')' : '') + '</td>' +
      '</tr>';
  }
  html += '</tbody></table>';
  if (body.venues && body.venues.length) {
    html += '<div class="sub" style="margin-top:10px;">Venues</div><div class="kv">';
    for (const v of body.venues) {
      html += '<div class="row"><span class="k">' + escapeHtml(v.name) + '</span><span>' + v.status +
        ' · trades ' + v.trades + ' · volume ' + v.volume + '</span></div>';
    }
    html += '</div>';
  }
  el.innerHTML = html;
}

function kvRows(pairs) {
  return '<div class="kv">' + pairs.map(([k, v]) =>
    '<div class="row"><span class="k">' + escapeHtml(k) + '</span><span>' + escapeHtml(v) + '</span></div>'
  ).join("") + '</div>';
}

function renderClock(groups) {
  const el = document.getElementById("clock-content");
  const list = groups.clock || [];
  if (!list.length) { el.innerHTML = '<span class="muted">No snapshots yet.</span>'; return; }
  const latest = list[list.length - 1];
  if (latest.status !== 200 || !latest.body) {
    el.innerHTML = '<span class="pill red">last fetch failed (HTTP ' + latest.status + ')</span>';
    return;
  }
  const b = latest.body;
  let html = kvRows([
    ["Tick", b.tick],
    ["Hours elapsed", b.t_hours],
    ["Tick length (s)", b.tick_seconds],
    ["Next tick in (s)", b.next_tick_in],
    ["Round", b.round + " — " + b.round_name],
    ["Doors", b.doors],
    ["Today", b.today_name],
    ["Closes", b.closes],
    ["Next opens", b.next_opens + " (" + b.next_name + ")"],
    ["Paused", b.paused],
  ]);
  if (b.days && b.days.length) {
    html += '<div class="sub" style="margin-top:10px;">Days</div><table><thead><tr><th>Day</th><th>Opens</th><th>Closes</th><th>Tick (s)</th></tr></thead><tbody>';
    for (const d of b.days) {
      html += '<tr><td>' + escapeHtml(d.name) + '</td><td>' + escapeHtml(d.opens) + '</td><td>' + escapeHtml(d.closes) + '</td><td>' + d.tick_seconds + '</td></tr>';
    }
    html += '</tbody></table>';
  }
  el.innerHTML = html;
}

function renderSchedule(groups) {
  const el = document.getElementById("schedule-content");
  const list = groups.schedule || [];
  if (!list.length) { el.innerHTML = '<span class="muted">No snapshots yet.</span>'; return; }
  const latest = list[list.length - 1];
  if (latest.status !== 200 || !latest.body) {
    el.innerHTML = '<span class="pill red">last fetch failed (HTTP ' + latest.status + ')</span>';
    return;
  }
  const b = latest.body;
  let html = '<div class="sub">now_hours: ' + b.now_hours + '</div><div class="upcoming-list">';
  for (const u of (b.upcoming || []).slice(0, 15)) {
    html += '<div class="u-row"><span class="u-at">+' + u.at_hours + 'h</span>' +
      '<span class="tag">' + escapeHtml(u.action) + '</span> ' + escapeHtml(u.note) +
      (u.wall ? ' <span class="muted">(' + escapeHtml(u.wall) + ')</span>' : '') +
      '</div>';
  }
  html += '</div>';
  if ((b.upcoming || []).length > 15) {
    html += '<details><summary>Show all ' + b.upcoming.length + ' upcoming events (raw)</summary><pre class="raw">' +
      escapeHtml(JSON.stringify(b.upcoming, null, 2)) + '</pre></details>';
  }
  el.innerHTML = html;
}

function renderDealers(groups) {
  const el = document.getElementById("dealers-content");
  const list = groups.dealers || [];
  if (!list.length) { el.innerHTML = '<span class="muted">No snapshots yet.</span>'; return; }
  const latest = list[list.length - 1];
  if (latest.status !== 200 || !latest.body) {
    el.innerHTML = '<span class="pill red">last fetch failed (HTTP ' + latest.status + ')</span>';
    return;
  }
  const personas = latest.body.personas || [];
  let html = "";
  for (const p of personas) {
    html += '<div class="card"><div class="flex-between"><h3>' +
      (p.avatar ? escapeHtml(p.avatar.emoji || "") + " " : "") + escapeHtml(p.name) + '</h3>' +
      '<span class="pill ' + (p.status === "active" ? "green" : "gray") + '">' + escapeHtml(p.status) + '</span></div>';
    if (p.title) html += '<div class="sub">' + escapeHtml(p.title) + '</div>';
    if (p.teaser) html += '<div class="sub">' + escapeHtml(p.teaser) + '</div>';
    if (p.bio) html += '<div class="sub">' + escapeHtml(p.bio.trim()) + '</div>';
    if (p.menu) {
      if (p.menu.sells && p.menu.sells.length) {
        html += '<div class="muted" style="font-size:12px;margin-top:6px;">Sells</div><table><tbody>';
        for (const s of p.menu.sells) {
          html += '<tr><td>' + escapeHtml(s.pack || s.rarity || "") + '</td><td>' + escapeHtml(s.name || "") +
            '</td><td>' + (s.list_price != null ? "list " + s.list_price : "") +
            (s.opening_ask != null ? " · ask " + s.opening_ask : "") + '</td></tr>';
        }
        html += '</tbody></table>';
      }
      if (p.menu.deals_per_team_per_hour != null) {
        html += '<div class="muted" style="font-size:12px;">Deals/team/hour: ' + p.menu.deals_per_team_per_hour + '</div>';
      }
    }
    html += '<details><summary>raw</summary><pre class="raw">' + escapeHtml(JSON.stringify(p, null, 2)) + '</pre></details>';
    html += '</div>';
  }
  el.innerHTML = html || '<span class="muted">No personas.</span>';
}

function renderLevels(groups) {
  const el = document.getElementById("levels-content");
  const list = groups.levels || [];
  if (!list.length) { el.innerHTML = '<span class="muted">No snapshots yet.</span>'; return; }
  const latest = list[list.length - 1];
  if (latest.status !== 200 || !latest.body) {
    el.innerHTML = '<span class="pill red">last fetch failed (HTTP ' + latest.status + ')</span>';
    return;
  }
  const levels = latest.body.levels || [];
  if (!levels.length) { el.innerHTML = '<span class="muted">No levels data.</span>'; return; }
  let html = '<table><thead><tr><th>ID</th><th>Kind</th><th>Name</th><th>State</th><th>Teaser</th></tr></thead><tbody>';
  for (const l of levels) {
    html += '<tr><td>' + escapeHtml(l.id) + '</td><td>' + escapeHtml(l.kind) + '</td><td>' + escapeHtml(l.name) +
      '</td><td>' + escapeHtml(l.state) + '</td><td class="muted">' + escapeHtml(l.teaser || "") + '</td></tr>';
  }
  html += '</tbody></table>';
  el.innerHTML = html;
}

function median(arr) {
  const s = [...arr].sort((a, b) => a - b);
  const mid = Math.floor(s.length / 2);
  return s.length % 2 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
}

function groupPricesByRarity(items) {
  const byRarity = {};
  for (const it of items) {
    if (!it.rarity) continue;
    (byRarity[it.rarity] = byRarity[it.rarity] || []).push(it);
  }
  return byRarity;
}

function renderRarityTable(byRarity, emptyLabel) {
  const rarities = Object.keys(byRarity).sort();
  if (!rarities.length) return '<div class="muted">No ' + escapeHtml(emptyLabel) + ' yet.</div>';
  let html = '<table><thead><tr><th>Rarity</th><th>Count</th><th>Min</th><th>Median</th><th>Max</th><th>Last 10</th></tr></thead><tbody>';
  for (const r of rarities) {
    const list = byRarity[r];
    const prices = list.map(x => x.price);
    const last10 = list.slice(-10).map(x => x.price);
    html += '<tr><td>' + escapeHtml(r) + '</td><td>' + prices.length + '</td><td>' + Math.min(...prices) +
      '</td><td>' + median(prices) + '</td><td>' + Math.max(...prices) + '</td><td class="muted">' +
      escapeHtml(last10.join(", ")) + '</td></tr>';
  }
  html += '</tbody></table>';
  return html;
}

// Backfill: a one-off full dump of /api/feed (data/feed_backfill.jsonl, one raw
// event object per line) fetched before the feed endpoint was polled regularly.
// Loaded once at startup into backfillEvents; merged with every poll's feed
// events here, deduped by id, since the 30/300-event polling window can overlap
// or (at low limits) miss events when the game speeds up.
let backfillEvents = [];

function getAllFeedEvents(groups) {
  const seen = new Set();
  const events = [];
  for (const ev of backfillEvents) {
    if (ev && ev.id != null && !seen.has(ev.id)) { seen.add(ev.id); events.push(ev); }
  }
  for (const entry of (groups.feed || [])) {
    if (entry.status !== 200 || !entry.body || !Array.isArray(entry.body.events)) continue;
    for (const ev of entry.body.events) {
      if (ev.id != null && !seen.has(ev.id)) { seen.add(ev.id); events.push(ev); }
    }
  }
  events.sort((a, b) => a.id - b.id);
  return events;
}

function teamNameMap(groups) {
  const list = groups.leaderboard || [];
  const latest = list.length ? list[list.length - 1] : null;
  const map = {};
  if (latest && latest.status === 200 && latest.body && Array.isArray(latest.body.teams)) {
    for (const t of latest.body.teams) map[t.team] = t.name;
  }
  return map;
}

function personaNameMap(groups) {
  const list = groups.dealers || [];
  const latest = list.length ? list[list.length - 1] : null;
  const map = {};
  if (latest && latest.status === 200 && latest.body && Array.isArray(latest.body.personas)) {
    for (const p of latest.body.personas) map[p.id] = p.name;
  }
  return map;
}

// A "deal" is a feed settlement event of kind "trade" whose parties[] includes
// the team: either team-vs-team (both "tNN", venue "rastro") or team-vs-persona
// (one party is a dealer id like "abuela"/"chato", venue null). Direction is
// read from items[].frm/items[].to, not from parties[] order.
function buildTeamDeals(teamId, groups) {
  const events = getAllFeedEvents(groups);
  const teams = teamNameMap(groups);
  const personas = personaNameMap(groups);
  const deals = [];
  for (const ev of events) {
    if (ev.type !== "settlement") continue;
    const p = ev.payload || {};
    const parties = Array.isArray(p.parties) ? p.parties : [];
    if (!parties.includes(teamId)) continue;
    const other = parties.find(x => x !== teamId) ?? parties[0];
    const items = Array.isArray(p.items) ? p.items : [];
    let side = null;
    for (const it of items) {
      if (it.frm === teamId) side = "sold";
      else if (it.to === teamId) side = "bought";
    }
    if (!side) continue;
    const counterparty = (other && /^t\d+$/.test(other)) ? (teams[other] || other) : (personas[other] || other);
    deals.push({
      id: ev.id,
      tick: ev.tick,
      t: ev.t,
      side,
      counterparty,
      venue: p.venue,
      price: p.price,
      items: items.map(it => ({ ref: it.ref || it.name || it.kind, rarity: it.rarity }))
    });
  }
  deals.sort((a, b) => b.id - a.id); // newest first
  return deals;
}

function renderRastroPrices(groups) {
  const el = document.getElementById("rastro-content");
  const feedList = groups.feed || [];
  const offersList = groups.rastro_offers || [];
  if (!feedList.length && !offersList.length) { el.innerHTML = '<span class="muted">No snapshots yet.</span>'; return; }

  // Closed trades: feed.events[].type === "settlement", payload.price + payload.items[].rarity.
  // Merge backfill + all polled snapshots, deduped by id (see getAllFeedEvents).
  const trades = [];
  for (const ev of getAllFeedEvents(groups)) {
    if (ev.type !== "settlement") continue;
    const p = ev.payload || {};
    if (p.price == null || !Array.isArray(p.items)) continue;
    for (const item of p.items) {
      if (item.rarity) trades.push({ rarity: item.rarity, price: p.price, id: ev.id });
    }
  }

  // Open offers: latest venues/rastro/offers snapshot. offer.give.assets[].rarity is the card
  // being offered, offer.want.cash is the asking price (offers with no give assets, e.g. cash-only
  // bids, are skipped since they have no rarity to bucket by).
  const latestOffers = offersList.length ? offersList[offersList.length - 1] : null;
  const offers = [];
  if (latestOffers && latestOffers.status === 200 && latestOffers.body && Array.isArray(latestOffers.body.offers)) {
    for (const o of latestOffers.body.offers) {
      const giveAssets = (o.give && o.give.assets) || [];
      const wantCash = o.want && o.want.cash;
      if (wantCash == null) continue;
      for (const a of giveAssets) {
        if (a.rarity) offers.push({ rarity: a.rarity, price: wantCash, id: o.id });
      }
    }
  }
  offers.sort((a, b) => a.id - b.id);

  const tradesByRarity = groupPricesByRarity(trades);
  const offersByRarity = groupPricesByRarity(offers);

  let html = '<div class="card"><h3>Closed trades (settlements)</h3><div class="sub">from feed events, price = settlement.payload.price</div>';
  html += renderRarityTable(tradesByRarity, "closed trades");
  html += '</div>';
  html += '<div class="card"><h3>Open offers</h3><div class="sub">current El Rastro offers, price = offer.want.cash</div>';
  html += renderRarityTable(offersByRarity, "open offers");
  html += '</div>';
  el.innerHTML = html;
}

function mean(arr) { return arr.reduce((a, b) => a + b, 0) / (arr.length || 1); }
function stddev(arr) {
  if (arr.length < 2) return 0;
  const m = mean(arr);
  return Math.sqrt(mean(arr.map(v => (v - m) * (v - m))));
}
function pearson(xs, ys) {
  const n = xs.length;
  if (n < 2) return null;
  const mx = mean(xs), my = mean(ys);
  let num = 0, dx2 = 0, dy2 = 0;
  for (let i = 0; i < n; i++) {
    const dx = xs[i] - mx, dy = ys[i] - my;
    num += dx * dy; dx2 += dx * dx; dy2 += dy * dy;
  }
  if (dx2 === 0 || dy2 === 0) return null;
  return num / Math.sqrt(dx2 * dy2);
}
function linreg(xs, ys) {
  const n = xs.length;
  if (n < 2) return { slope: 0, intercept: ys[0] || 0, r2: null };
  const mx = mean(xs), my = mean(ys);
  let num = 0, den = 0;
  for (let i = 0; i < n; i++) { num += (xs[i] - mx) * (ys[i] - my); den += (xs[i] - mx) * (xs[i] - mx); }
  const slope = den ? num / den : 0;
  const r = pearson(xs, ys);
  return { slope, intercept: my - slope * mx, r2: r === null ? null : r * r };
}

// Build per-team leaderboard time series from the full snapshot history.
function buildLeaderboardSeries(groups) {
  const list = (groups.leaderboard || []).filter(e => e.status === 200 && e.body && Array.isArray(e.body.teams));
  const byTeam = new Map();
  for (const snap of list) {
    const tMs = new Date(snap.ts).getTime();
    for (const t of snap.body.teams) {
      if (!byTeam.has(t.team)) byTeam.set(t.team, { name: t.name, points: [] });
      byTeam.get(t.team).points.push({
        ts: snap.ts, tMs,
        score: t.score, rank: t.rank, level: t.level,
        badges: Array.isArray(t.badges) ? t.badges.length : 0,
        deals: t.deals, market: t.market, luck: t.luck
      });
    }
  }
  return { snapshotCount: list.length, byTeam };
}

function filterWindow(points, minutes) {
  if (minutes === "all" || !points.length) return points;
  const latestMs = points[points.length - 1].tMs;
  const cutoff = latestMs - minutes * 60 * 1000;
  const inWindow = points.filter(p => p.tMs >= cutoff);
  return inWindow.length >= 2 ? inWindow : points.slice(Math.max(0, points.length - 2));
}

function renderMomentum(byTeam, minutes) {
  const rows = [];
  for (const [teamId, data] of byTeam) {
    const pts = filterWindow(data.points, minutes);
    if (pts.length < 2) continue;
    const first = pts[0], last = pts[pts.length - 1];
    const elapsedMin = Math.max((last.tMs - first.tMs) / 60000, 1 / 60);
    const dScore = last.score - first.score;
    const dRank = last.rank - first.rank; // negative = moved up (better)
    rows.push({ teamId, name: data.name, score: last.score, rank: last.rank, dScore, dRank, velocity: dScore / elapsedMin });
  }
  if (!rows.length) return '<div class="muted">Not enough data in this window yet.</div>';
  rows.sort((a, b) => b.velocity - a.velocity);
  const risers = rows.filter(r => r.dRank < 0).slice().sort((a, b) => a.dRank - b.dRank).slice(0, 3).map(r => r.teamId);
  const fallers = rows.filter(r => r.dRank > 0).slice().sort((a, b) => b.dRank - a.dRank).slice(0, 3).map(r => r.teamId);
  let html = '<table><thead><tr><th>Team</th><th>Score</th><th>Rank</th><th>&Delta;Score</th><th>&Delta;Rank</th><th>Score/min</th></tr></thead><tbody>';
  for (const r of rows) {
    let tag = "";
    if (risers.includes(r.teamId)) tag = ' <span class="pill green">riser</span>';
    else if (fallers.includes(r.teamId)) tag = ' <span class="pill red">faller</span>';
    html += '<tr><td><span class="team-link" data-team="' + escapeHtml(r.teamId) + '">' + escapeHtml(r.name) + '</span>' + tag + '</td><td>' + r.score.toFixed(2) + '</td><td>' + r.rank +
      '</td><td>' + (r.dScore >= 0 ? "+" : "") + r.dScore.toFixed(2) + '</td><td>' + (r.dRank >= 0 ? "+" : "") + r.dRank +
      '</td><td>' + r.velocity.toFixed(3) + '</td></tr>';
  }
  html += '</tbody></table>';
  return html;
}

function renderEvents(byTeam) {
  const events = [];
  const allDScores = [];
  for (const [, data] of byTeam) {
    const pts = data.points;
    for (let i = 1; i < pts.length; i++) allDScores.push(pts[i].score - pts[i - 1].score);
  }
  const jumpMean = mean(allDScores);
  const jumpStd = stddev(allDScores);
  const haveEnoughForJumps = allDScores.length >= 10 && jumpStd > 0;
  const jumpThreshold = jumpMean + 2 * jumpStd;

  // Track who held rank 1 at each timestamp across the merged timeline.
  const allTs = new Set();
  for (const [, data] of byTeam) for (const p of data.points) allTs.add(p.ts);
  const sortedTs = Array.from(allTs).sort();
  const leaderAtTs = new Map();
  for (const ts of sortedTs) {
    let leaderHere = null;
    for (const [teamId, data] of byTeam) {
      const p = data.points.find(pp => pp.ts === ts);
      if (p && p.rank === 1) leaderHere = teamId;
    }
    leaderAtTs.set(ts, leaderHere);
  }

  for (const [teamId, data] of byTeam) {
    const pts = data.points;
    for (let i = 1; i < pts.length; i++) {
      const prev = pts[i - 1], cur = pts[i];
      const dScore = cur.score - prev.score;
      if (haveEnoughForJumps && dScore > jumpThreshold) {
        events.push({ ts: cur.ts, team: data.name, type: "big jump", detail: "score " + prev.score.toFixed(2) + " → " + cur.score.toFixed(2) + " (+" + dScore.toFixed(2) + ")" });
      }
      if (cur.level > prev.level) {
        events.push({ ts: cur.ts, team: data.name, type: "level up", detail: "level " + prev.level + " → " + cur.level });
      }
      if (cur.badges > prev.badges) {
        events.push({ ts: cur.ts, team: data.name, type: "badge unlocked", detail: (cur.badges - prev.badges) + " new badge(s), total " + cur.badges });
      }
      if (cur.rank === 1 && prev.rank !== 1) {
        const prevLeaderId = leaderAtTs.get(prev.ts);
        if (prevLeaderId && prevLeaderId !== teamId) {
          events.push({ ts: cur.ts, team: data.name, type: "new leader", detail: "took rank 1 from " + prevLeaderId });
        }
      }
    }
  }
  events.sort((a, b) => new Date(b.ts) - new Date(a.ts));
  const shown = events.slice(0, 100);
  let html = "";
  if (!haveEnoughForJumps) {
    html += '<div class="muted" style="margin-bottom:8px;">Not enough history yet to derive a reliable score-jump threshold (need &ge;10 consecutive-snapshot deltas with some variance); big-jump detection is disabled for now, other event types still active.</div>';
  } else {
    html += '<div class="muted" style="margin-bottom:8px;">Big-jump threshold: &Delta;score &gt; ' + jumpThreshold.toFixed(2) + ' (mean ' + jumpMean.toFixed(2) + ' + 2&times;stddev ' + jumpStd.toFixed(2) + ', n=' + allDScores.length + ')</div>';
  }
  if (!shown.length) {
    html += '<div class="muted">No events detected yet.</div>';
    return html;
  }
  html += '<table><thead><tr><th>Time</th><th>Team</th><th>Event</th><th>Detail</th></tr></thead><tbody>';
  for (const e of shown) {
    html += '<tr><td>' + escapeHtml(e.ts) + '</td><td>' + escapeHtml(e.team) + '</td><td><span class="tag">' + escapeHtml(e.type) + '</span></td><td>' + escapeHtml(e.detail) + '</td></tr>';
  }
  html += '</tbody></table>';
  return html;
}

function renderCorrelations(byTeam) {
  const dScoreArr = [], dDealsArr = [], marketArr = [], luckArr = [];
  for (const [, data] of byTeam) {
    const pts = data.points;
    for (let i = 1; i < pts.length; i++) {
      const prev = pts[i - 1], cur = pts[i];
      dScoreArr.push(cur.score - prev.score);
      dDealsArr.push(cur.deals - prev.deals);
      marketArr.push(cur.market);
      luckArr.push(cur.luck);
    }
  }
  const n = dScoreArr.length;
  const describe = r => {
    if (r === null) return "no variance in one of the variables, cannot compute";
    const abs = Math.abs(r);
    if (abs < 0.1) return "r≈0 → no clear relationship";
    const strength = abs >= 0.7 ? "closely" : abs >= 0.4 ? "fairly closely" : "weakly";
    const dir = r > 0 ? "tracks" : "inversely tracks (negative r)";
    return "r=" + r.toFixed(2) + " → " + dir + " " + strength + " with score growth";
  };
  const rows = [
    { label: "&Delta;deals (cumulative counter, delta used)", r: pearson(dScoreArr, dDealsArr) },
    { label: "market (point-in-time value, raw value used)", r: pearson(dScoreArr, marketArr) },
    { label: "luck (point-in-time value, raw value used)", r: pearson(dScoreArr, luckArr) }
  ];
  let html = '<div class="muted" style="margin-bottom:8px;">Based on n=' + n + ' consecutive-snapshot pairs pooled across all teams' +
    (n < 20 ? ' — small sample, treat these as noisy/preliminary.' : '.') + '</div>';
  html += '<table><thead><tr><th>Variable</th><th>r</th><th>Read</th></tr></thead><tbody>';
  for (const row of rows) {
    html += '<tr><td>&Delta;score vs ' + row.label + '</td><td>' + (row.r === null ? "n/a" : row.r.toFixed(3)) + '</td><td>' + describe(row.r) + '</td></tr>';
  }
  html += '</tbody></table>';
  return html;
}

function renderVolatility(byTeam) {
  const rows = [];
  for (const [teamId, data] of byTeam) {
    const pts = data.points;
    if (pts.length < 2) continue;
    const ranks = pts.map(p => p.rank);
    const scores = pts.map(p => p.score);
    const idx = pts.map((_, i) => i);
    const rankSd = stddev(ranks);
    const { slope, r2 } = linreg(idx, scores);
    let label = "flat";
    if (r2 !== null && r2 >= 0.6 && slope > 0.01) label = "steady climber";
    else if (r2 !== null && r2 < 0.3 && rankSd > 1) label = "volatile";
    rows.push({ teamId, name: data.name, rankSd, slope, r2, n: pts.length, label });
  }
  if (!rows.length) return '<div class="muted">Not enough data yet.</div>';
  rows.sort((a, b) => b.rankSd - a.rankSd);
  let html = '<table><thead><tr><th>Team</th><th>Rank stddev</th><th>Score slope</th><th>R&sup2;</th><th>n</th><th>Label</th></tr></thead><tbody>';
  for (const r of rows) {
    html += '<tr><td><span class="team-link" data-team="' + escapeHtml(r.teamId) + '">' + escapeHtml(r.name) + '</span></td><td>' + r.rankSd.toFixed(2) + '</td><td>' + r.slope.toFixed(3) +
      '</td><td>' + (r.r2 === null ? "n/a" : r.r2.toFixed(2)) + '</td><td>' + r.n + '</td><td><span class="tag">' + r.label + '</span></td></tr>';
  }
  html += '</tbody></table>';
  return html;
}

function renderPatterns(groups) {
  const el = document.getElementById("patterns-content");
  const { snapshotCount, byTeam } = buildLeaderboardSeries(groups);
  if (snapshotCount < 2 || byTeam.size === 0) {
    el.innerHTML = '<div class="muted">Not enough leaderboard snapshots yet (n=' + snapshotCount + ') to compute patterns.</div>';
    return;
  }
  const windowSel = document.getElementById("patterns-window");
  const minutes = windowSel.value === "all" ? "all" : Number(windowSel.value);
  let html = '<div class="muted" style="margin-bottom:10px;">n=' + snapshotCount + ' leaderboard snapshots analyzed, ' + byTeam.size + ' teams.</div>';
  html += '<div class="card"><h3>Momentum / movers</h3><div class="sub">Window: ' + (minutes === "all" ? "all history" : "last " + minutes + "m") + '</div>' + renderMomentum(byTeam, minutes) + '</div>';
  html += '<div class="card"><h3>Event feed</h3><div class="sub">Newest first, capped at 100</div>' + renderEvents(byTeam) + '</div>';
  html += '<div class="card"><h3>Correlations</h3>' + renderCorrelations(byTeam) + '</div>';
  html += '<div class="card"><h3>Volatility / stability</h3>' + renderVolatility(byTeam) + '</div>';
  el.innerHTML = html;
}

let lastGroups = null;
let patternsTick = 0;
document.getElementById("patterns-window").addEventListener("change", () => {
  if (lastGroups) renderPatterns(lastGroups);
});

// --- Team detail panel -----------------------------------------------------
// The backdrop/panel elements always exist in the DOM; opening/closing just
// toggles a class and (re)writes #team-panel-content, so a 5s refresh while
// the panel is open updates its content in place instead of recreating or
// flickering it.
let openTeamId = null;

function openTeamPanel(teamId) {
  openTeamId = teamId;
  document.getElementById("team-panel-backdrop").classList.add("open");
  renderTeamPanel(lastGroups || { leaderboard: [], feed: [], dealers: [] });
}

function closeTeamPanel() {
  openTeamId = null;
  document.getElementById("team-panel-backdrop").classList.remove("open");
}

document.addEventListener("click", (e) => {
  const link = e.target.closest(".team-link");
  if (link) { openTeamPanel(link.dataset.team); return; }
  if (e.target.id === "team-panel-close-btn") { closeTeamPanel(); return; }
  if (e.target.id === "team-panel-backdrop") { closeTeamPanel(); return; }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeTeamPanel();
});

function renderTeamPanel(groups) {
  if (!openTeamId) return;
  const content = document.getElementById("team-panel-content");
  const teamId = openTeamId;
  const teams = teamNameMap(groups);
  const teamName = teams[teamId] || teamId;

  const deals = buildTeamDeals(teamId, groups);
  const bought = deals.filter(d => d.side === "bought");
  const sold = deals.filter(d => d.side === "sold");
  const spent = bought.reduce((a, d) => a + (d.price || 0), 0);
  const received = sold.reduce((a, d) => a + (d.price || 0), 0);
  const net = received - spent;

  const lbList = (groups.leaderboard || []).filter(e => e.status === 200 && e.body && Array.isArray(e.body.teams));
  const scoreHist = [], rankHist = [];
  let dealsReported = null;
  for (const snap of lbList) {
    const t = snap.body.teams.find(x => x.team === teamId);
    if (t) {
      scoreHist.push(t.score);
      rankHist.push(t.rank);
      dealsReported = t.deals;
    }
  }

  let html = '<div class="flex-between"><h3>' + escapeHtml(teamName) + ' <span class="muted">(' + escapeHtml(teamId) + ')</span></h3>' +
    '<span id="team-panel-close-btn" class="pill gray" style="cursor:pointer;">Close ✕</span></div>';

  html += '<div class="sub" style="margin-top:10px;">Score trend</div>' + sparkline(scoreHist.slice(-40), 200, 32);
  html += '<div class="sub" style="margin-top:4px;">Current rank: ' + (rankHist.length ? rankHist[rankHist.length - 1] : "n/a") + '</div>';

  html += '<div class="kv" style="margin-top:12px;">' +
    '<div class="row"><span class="k">Deals found</span><span>' + deals.length + '</span></div>' +
    '<div class="row"><span class="k">Primas spent</span><span>' + spent + '</span></div>' +
    '<div class="row"><span class="k">Primas received</span><span>' + received + '</span></div>' +
    '<div class="row"><span class="k">Net</span><span>' + (net >= 0 ? "+" : "") + net + '</span></div>' +
    '</div>';

  html += '<div class="muted" style="margin:10px 0;">showing ' + deals.length + ' deals found in the feed, leaderboard says ' +
    (dealsReported == null ? "?" : dealsReported) + ' deals</div>';

  if (!deals.length) {
    html += '<div class="muted">No settlement events found for this team in the feed (backfill + poll window).</div>';
  } else {
    html += '<table><thead><tr><th>Tick</th><th>Time</th><th>Side</th><th>Counterparty</th><th>Cards</th><th>Price</th><th>Venue</th></tr></thead><tbody>';
    for (const d of deals) {
      const cards = d.items.map(it => escapeHtml(it.ref || "") + (it.rarity ? " (" + escapeHtml(it.rarity) + ")" : "")).join(", ");
      html += "<tr><td>" + d.tick + "</td><td>" + (typeof d.t === "number" ? d.t.toFixed(2) + "h" : "") + "</td><td>" +
        d.side + "</td><td>" + escapeHtml(d.counterparty) + "</td><td class=\"muted\">" + cards + "</td><td>" +
        (d.price ?? "") + "</td><td class=\"muted\">" + escapeHtml(d.venue || "-") + "</td></tr>";
    }
    html += "</tbody></table>";
  }

  content.innerHTML = html;
}

let openHistoryKeys = new Set();

function renderHistory(groups) {
  const el = document.getElementById("history-content");
  let html = "";
  for (const ep of ENDPOINTS) {
    const list = (groups[ep] || []).slice(-HISTORY_CAP).slice().reverse();
    html += '<div class="sub" style="margin-top:10px;font-weight:600;color:var(--text);">' + escapeHtml(ep) +
      ' <span class="muted" style="font-weight:400;">(' + list.length + ' shown, most recent first)</span></div>';
    html += '<table><tbody>';
    list.forEach((e, idx) => {
      const key = ep + "-" + e.ts + "-" + idx;
      const ok = e.status === 200;
      const rowId = "hrow-" + key.replace(/[^a-zA-Z0-9]/g, "_");
      html += '<tr class="history-row" data-target="' + rowId + '">' +
        '<td class="' + (ok ? "status-green" : "status-red") + '">' + e.status + '</td>' +
        '<td>' + escapeHtml(e.ts) + '</td>' +
        '<td class="muted">' + fmtAgo(e.ts) + '</td>' +
        '</tr>';
      html += '<tr class="history-body' + (openHistoryKeys.has(rowId) ? " open" : "") + '" id="' + rowId + '">' +
        '<td colspan="3"><pre class="raw">' + escapeHtml(JSON.stringify(e.body, null, 2)) + '</pre></td></tr>';
    });
    html += '</tbody></table>';
  }
  el.innerHTML = html;
  el.querySelectorAll(".history-row").forEach(row => {
    row.addEventListener("click", () => {
      const target = document.getElementById(row.dataset.target);
      target.classList.toggle("open");
      if (target.classList.contains("open")) openHistoryKeys.add(row.dataset.target);
      else openHistoryKeys.delete(row.dataset.target);
    });
  });
}

async function refresh() {
  const banner = document.getElementById("error-banner");
  try {
    const res = await fetch("data/snapshots.jsonl?_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status + " fetching snapshots.jsonl");
    const text = await res.text();
    const entries = parseJsonl(text);
    const groups = groupByEndpoint(entries);
    banner.innerHTML = "";
    renderHealth(groups);
    renderLeaderboard(groups);
    renderClock(groups);
    renderSchedule(groups);
    renderDealers(groups);
    renderLevels(groups);
    renderRastroPrices(groups);
    lastGroups = groups;
    patternsTick++;
    if (patternsTick === 1 || patternsTick % 3 === 0) renderPatterns(groups);
    renderHistory(groups);
    renderTeamPanel(groups);
  } catch (err) {
    banner.innerHTML = '<div class="error-banner">Failed to load snapshots.jsonl: ' + escapeHtml(err.message) + '</div>';
    console.error(err);
  }
}

async function loadBackfill() {
  try {
    const res = await fetch("data/feed_backfill.jsonl?_=" + Date.now(), { cache: "no-store" });
    if (!res.ok) return;
    const text = await res.text();
    backfillEvents = parseJsonl(text);
  } catch (e) {
    console.warn("backfill load failed", e);
  }
}

(async () => {
  await loadBackfill();
  refresh();
  setInterval(refresh, REFRESH_MS);
})();
