<!-- @dsCard height=288 -->
<style>
  .cv{position:relative;width:960px;height:288px;background:var(--bg);overflow:hidden}
  .cv svg{position:absolute;inset:0}
  .b-us{fill:var(--us)} .b-them{fill:var(--them)} .b-ok{fill:var(--ok)} .b-ink{fill:var(--ink)} .b-tint{fill:var(--us-soft)} .dot{fill:var(--bg)}
  .r-lg{rx:var(--radius-lg)}
  .cv-text{position:absolute;left:40px;bottom:28px;max-width:440px;display:flex;flex-direction:column;gap:8px}
  .cv-name{font-family:var(--font-display);font-weight:800;font-size:64px;line-height:.95;color:var(--ink);margin:0}
  .cv-tag{font-family:var(--font-body);font-size:14px;color:var(--muted);margin:0}
</style>
<div class="cv">
  <svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
    <!-- blocks: us 180×208 and them 180×208 (the two sides), ok 96×64 (where they meet = the ZOPA), ink 96×100, us-soft tint 288×68; corners radius-lg
         arrangement: two tall slabs facing each other across a gap, one bleeding off the top, the other off the bottom-right, the small green block in the gap where they meet
         pattern: dot grid, "precise, technical, mono": the system is a data viewer built on mono labels and chart grids; 24 dots cut out of the rival slab
         steps: dot pitch 28px (2 × space-4), dot r 3; block gaps 12px ≈ space-3; radius-lg on every block -->
    <rect class="b-us r-lg" x="480" y="-10" width="180" height="218"/>
    <rect class="b-ink r-lg" x="672" y="-10" width="96" height="110"/>
    <rect class="b-ok r-lg" x="672" y="112" width="96" height="64"/>
    <rect class="b-them r-lg" x="780" y="80" width="190" height="218"/>
    <rect class="b-tint r-lg" x="480" y="220" width="288" height="78"/>
    <g>
      <circle class="dot" cx="808" cy="108" r="3"/><circle class="dot" cx="836" cy="108" r="3"/><circle class="dot" cx="864" cy="108" r="3"/><circle class="dot" cx="892" cy="108" r="3"/>
      <circle class="dot" cx="808" cy="136" r="3"/><circle class="dot" cx="836" cy="136" r="3"/><circle class="dot" cx="864" cy="136" r="3"/><circle class="dot" cx="892" cy="136" r="3"/>
      <circle class="dot" cx="808" cy="164" r="3"/><circle class="dot" cx="836" cy="164" r="3"/><circle class="dot" cx="864" cy="164" r="3"/><circle class="dot" cx="892" cy="164" r="3"/>
      <circle class="dot" cx="808" cy="192" r="3"/><circle class="dot" cx="836" cy="192" r="3"/><circle class="dot" cx="864" cy="192" r="3"/><circle class="dot" cx="892" cy="192" r="3"/>
      <circle class="dot" cx="808" cy="220" r="3"/><circle class="dot" cx="836" cy="220" r="3"/><circle class="dot" cx="864" cy="220" r="3"/><circle class="dot" cx="892" cy="220" r="3"/>
      <circle class="dot" cx="808" cy="248" r="3"/><circle class="dot" cx="836" cy="248" r="3"/><circle class="dot" cx="864" cy="248" r="3"/><circle class="dot" cx="892" cy="248" r="3"/>
    </g>
  </svg>
  <div class="cv-text">
    <p class="cv-name">Negotiation<br>Ring</p>
    <p class="cv-tag">Nosotros en azul, el rival en ámbar, el trato en verde.</p>
  </div>
</div>
